<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Admin Portal - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #4f46e5; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-btn.active { border-bottom: 2px solid #4f46e5; color: #4f46e5; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

    <!-- ========================================== -->
    <!-- 1. LOGIN SCREEN -->
    <!-- ========================================== -->
    <div id="loginScreen" class="h-full flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden fade-in">
            <div class="bg-slate-800 p-8 text-center">
                <i class="fa-solid fa-graduation-cap text-4xl text-white mb-2"></i>
                <h2 class="text-2xl font-bold text-white">School Portal</h2>
                <p class="text-slate-300 text-sm mt-1">Login to manage your institution</p>
            </div>
            <div class="p-8">
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                        <input type="text" id="loginUser" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                        <input type="password" id="loginPass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg flex justify-center items-center transition-all">Secure Login</button>
                    <div id="loginError" class="hidden text-red-500 text-sm text-center font-medium mt-2"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. DASHBOARD SCREEN -->
    <!-- ========================================== -->
    <div id="dashboardScreen" class="hidden h-full flex flex-col">
        
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 shadow-sm z-20">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-xl shadow-md" id="headerSchoolInitials">S</div>
                    <div>
                        <h1 id="headerSchoolName" class="font-bold text-slate-800 text-lg leading-tight">School Name</h1>
                        <p class="text-xs text-slate-500 font-medium">Admin Dashboard</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-2"><i class="fa-solid fa-power-off text-xl"></i></button>
            </div>

            <!-- Tab Navigation (Mobile friendly horizontal scroll) -->
            <div class="max-w-7xl mx-auto px-4 flex overflow-x-auto border-t border-slate-100">
                <button onclick="switchTab('notices')" class="tab-btn active px-4 py-3 text-sm text-slate-500 whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-2"></i>Notices</button>
                <button onclick="switchTab('gallery')" class="tab-btn px-4 py-3 text-sm text-slate-500 whitespace-nowrap"><i class="fa-solid fa-image mr-2"></i>Gallery</button>
                <button onclick="switchTab('settings')" class="tab-btn px-4 py-3 text-sm text-slate-500 whitespace-nowrap"><i class="fa-solid fa-gear mr-2"></i>Branding Setup</button>
            </div>
        </header>

        <!-- Main Area -->
        <main class="flex-1 overflow-y-auto bg-slate-50 p-4">
            <div class="max-w-7xl mx-auto">
                
                <!-- TAB 1: NOTICES (Existing) -->
                <div id="tab-notices" class="tab-content active fade-in space-y-6">
                    <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-4 text-sm uppercase"><i class="fa-solid fa-plus-circle mr-2 text-indigo-500"></i>Add Notice</h3>
                        <form id="noticeForm" class="flex flex-col md:flex-row gap-4">
                            <input type="text" id="noticeTitle" required class="flex-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none" placeholder="Notice Title">
                            <input type="date" id="noticeDate" required class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none w-full md:w-auto">
                            <button type="submit" id="noticeBtn" class="bg-slate-800 text-white font-medium py-2 px-6 rounded-lg text-sm hover:bg-black">Publish</button>
                        </form>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-100 px-4 py-3 border-b flex justify-between"><h3 class="font-bold text-slate-700 text-sm">Active Notices</h3><button onclick="fetchNotices()" class="text-xs text-indigo-600 font-bold"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button></div>
                        <div id="noticeList" class="p-4 space-y-2 max-h-[300px] overflow-y-auto"></div>
                    </div>
                </div>

                <!-- TAB 2: GALLERY (New) -->
                <div id="tab-gallery" class="tab-content fade-in space-y-6">
                    <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-4 text-sm uppercase"><i class="fa-solid fa-image mr-2 text-indigo-500"></i>Add Photo</h3>
                        <form id="galleryForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input type="text" id="imgUrl" required class="md:col-span-1 px-3 py-2 border rounded-lg text-sm outline-none" placeholder="Image URL (e.g. from Imgur or Drive)">
                            <input type="text" id="imgCaption" required class="md:col-span-1 px-3 py-2 border rounded-lg text-sm outline-none" placeholder="Photo Caption">
                            <button type="submit" id="galleryBtn" class="bg-indigo-600 text-white font-medium py-2 px-6 rounded-lg text-sm hover:bg-indigo-700">Add to Gallery</button>
                        </form>
                        <p class="text-[10px] text-slate-400 mt-2">*For mobile users, upload photo to a free site like imgbb.com and paste the direct link here.</p>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-100 px-4 py-3 border-b"><h3 class="font-bold text-slate-700 text-sm">Live Gallery</h3></div>
                        <div id="galleryList" class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4 max-h-[400px] overflow-y-auto"></div>
                    </div>
                </div>

                <!-- TAB 3: SETTINGS / BRANDING (New) -->
                <div id="tab-settings" class="tab-content fade-in">
                    <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-4 text-sm uppercase"><i class="fa-solid fa-paint-roller mr-2 text-indigo-500"></i>White-Label Branding Setup</h3>
                        <form id="settingsForm" class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Website Primary Color</label>
                                <div class="flex items-center gap-3">
                                    <input type="color" id="primaryColor" class="w-12 h-12 rounded cursor-pointer border-0 p-0" value="#2563EB">
                                    <span class="text-sm text-slate-500">Choose your school's official color</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">School Logo URL</label>
                                <input type="text" id="logoUrl" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:border-indigo-500" placeholder="https://link-to-your-logo.png">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">About Us / Welcome Message</label>
                                <textarea id="aboutText" rows="4" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:border-indigo-500" placeholder="Write a short welcome message for your public website..."></textarea>
                            </div>
                            <button type="submit" id="settingsBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg text-sm hover:bg-green-700 transition-all shadow-md">
                                Save Branding Settings
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = "https://xlmsgtxyrlovjobwvdom.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_iLRrB73mPbgH0FtPvMOVbg_eoNyCtd3"; 
        const headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };

        document.addEventListener('DOMContentLoaded', () => {
            const sid = localStorage.getItem('school_id');
            const sname = localStorage.getItem('school_name');
            document.getElementById('noticeDate').valueAsDate = new Date();
            if(sid && sname) showDashboard(sname);
        });

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            btn.innerHTML = `<div class="loader"></div>`; err.classList.add('hidden');

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/schools?username=eq.${document.getElementById('loginUser').value}&password=eq.${document.getElementById('loginPass').value}&select=id,school_name`, { headers });
                const data = await res.json();
                if(data.length === 0) throw new Error("Invalid Credentials!");
                
                localStorage.setItem('school_id', data[0].id);
                localStorage.setItem('school_name', data[0].school_name);
                showDashboard(data[0].school_name);
            } catch (error) {
                err.innerText = error.message; err.classList.remove('hidden');
                btn.innerHTML = `Secure Login`;
            }
        });

        function showDashboard(name) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('headerSchoolName').innerText = name;
            document.getElementById('headerSchoolInitials').innerText = name.charAt(0).toUpperCase();
            
            fetchNotices(); // Load default tab
            fetchGallery();
            fetchSettings();
        }

        function logout() { localStorage.clear(); window.location.reload(); }

        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // --- NOTICES LOGIC ---
        async function fetchNotices() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/notices?school_id=eq.${localStorage.getItem('school_id')}&order=created_at.desc`, { headers });
            const data = await res.json();
            const list = document.getElementById('noticeList');
            if(data.length===0) return list.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">No notices yet.</p>`;
            list.innerHTML = data.map(n => `<div class="flex justify-between items-center p-3 border-b"><div class="text-sm font-semibold text-slate-800">${n.title} <span class="text-xs font-normal text-slate-400 block">${n.notice_date}</span></div> <button onclick="delData('notices','${n.id}')" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button></div>`).join('');
        }
        document.getElementById('noticeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(`${SUPABASE_URL}/rest/v1/notices`, {
                method: 'POST', headers,
                body: JSON.stringify({ school_id: localStorage.getItem('school_id'), title: document.getElementById('noticeTitle').value, notice_date: document.getElementById('noticeDate').value })
            });
            document.getElementById('noticeForm').reset(); document.getElementById('noticeDate').valueAsDate = new Date(); fetchNotices();
        });

        // --- GALLERY LOGIC ---
        async function fetchGallery() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/galleries?school_id=eq.${localStorage.getItem('school_id')}&order=created_at.desc`, { headers });
            const data = await res.json();
            const list = document.getElementById('galleryList');
            if(data.length===0) return list.innerHTML = `<div class="col-span-full text-center text-sm text-slate-400">No photos added.</div>`;
            list.innerHTML = data.map(img => `
                <div class="relative group rounded-lg overflow-hidden border">
                    <img src="${img.image_url}" class="w-full h-24 object-cover" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                    <div class="absolute bottom-0 w-full bg-black/60 text-white text-[10px] p-1 truncate">${img.caption}</div>
                    <button onclick="delData('galleries','${img.id}')" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full opacity-0 group-hover:opacity-100"><i class="fa-solid fa-times text-xs"></i></button>
                </div>
            `).join('');
        }
        document.getElementById('galleryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(`${SUPABASE_URL}/rest/v1/galleries`, {
                method: 'POST', headers,
                body: JSON.stringify({ school_id: localStorage.getItem('school_id'), image_url: document.getElementById('imgUrl').value, caption: document.getElementById('imgCaption').value })
            });
            document.getElementById('galleryForm').reset(); fetchGallery();
        });

        // --- SETTINGS (BRANDING) LOGIC ---
        async function fetchSettings() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/schools?id=eq.${localStorage.getItem('school_id')}&select=primary_color,logo_url,about_us_text`, { headers });
            const data = await res.json();
            if(data.length > 0) {
                if(data[0].primary_color) document.getElementById('primaryColor').value = data[0].primary_color;
                if(data[0].logo_url) document.getElementById('logoUrl').value = data[0].logo_url;
                if(data[0].about_us_text) document.getElementById('aboutText').value = data[0].about_us_text;
            }
        }
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('settingsBtn'); btn.innerText = "Saving...";
            await fetch(`${SUPABASE_URL}/rest/v1/schools?id=eq.${localStorage.getItem('school_id')}`, {
                method: 'PATCH', headers,
                body: JSON.stringify({
                    primary_color: document.getElementById('primaryColor').value,
                    logo_url: document.getElementById('logoUrl').value,
                    about_us_text: document.getElementById('aboutText').value
                })
            });
            btn.innerText = "Saved Successfully!"; btn.classList.replace('bg-green-600', 'bg-slate-800');
            setTimeout(() => { btn.innerText = "Save Branding Settings"; btn.classList.replace('bg-slate-800', 'bg-green-600'); }, 2000);
        });

        // Universal Delete Function
        async function delData(table, id) {
            if(!confirm("Delete this item?")) return;
            await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'DELETE', headers });
            if(table === 'notices') fetchNotices(); else fetchGallery();
        }
    </script>
</body>
</html>
