<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#4f46e5', dark: '#1e293b' } } }
        }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #4f46e5; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased h-screen overflow-hidden">

    <!-- ========================================== -->
    <!-- 1. LOGIN SCREEN -->
    <!-- ========================================== -->
    <div id="loginScreen" class="h-full flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden fade-in">
            <div class="bg-dark p-8 text-center">
                <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-graduation-cap text-3xl text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">School Portal</h2>
                <p class="text-slate-300 text-sm mt-1">Login to manage your institution</p>
            </div>
            <div class="p-8">
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400"></i>
                            <input type="text" id="loginUser" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand outline-none transition-all" placeholder="Enter username">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400"></i>
                            <input type="password" id="loginPass" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand outline-none transition-all" placeholder="Enter password">
                        </div>
                    </div>
                    <button type="submit" id="loginBtn" class="w-full bg-brand hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-all flex justify-center items-center">
                        <span>Secure Login</span>
                    </button>
                    <div id="loginError" class="hidden text-red-500 text-sm text-center font-medium mt-2"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. DASHBOARD SCREEN (Hidden by default) -->
    <!-- ========================================== -->
    <div id="dashboardScreen" class="hidden h-full flex flex-col">
        
        <!-- Mobile/Desktop Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-brand text-white rounded-lg flex items-center justify-center font-bold text-xl mr-3 shadow-md">
                        <span id="headerSchoolInitials">S</span>
                    </div>
                    <div>
                        <h1 id="headerSchoolName" class="font-bold text-slate-800 text-lg leading-tight">School Name</h1>
                        <p class="text-xs text-slate-500 font-medium">Admin Dashboard</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-slate-500 hover:text-red-500 transition-colors p-2">
                    <i class="fa-solid fa-arrow-right-from-bracket text-xl"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Scrollable Area -->
        <main class="flex-1 overflow-y-auto bg-slate-50 p-4 md:p-8">
            <div class="max-w-7xl mx-auto space-y-6">
                
                <!-- Notice Board Management Module -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden fade-in">
                    <div class="bg-slate-800 px-6 py-4 flex justify-between items-center">
                        <h2 class="text-white font-semibold"><i class="fa-solid fa-bullhorn mr-2 text-yellow-400"></i> Notice Board Management</h2>
                    </div>
                    
                    <div class="p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                        
                        <!-- Add Notice Form -->
                        <div class="md:col-span-1 bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <h3 class="font-bold text-slate-700 mb-4 text-sm uppercase tracking-wider">Publish New Notice</h3>
                            <form id="noticeForm" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Notice Title *</label>
                                    <input type="text" id="noticeTitle" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand outline-none text-sm" placeholder="e.g. Holiday Tomorrow">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Details (Optional)</label>
                                    <textarea id="noticeDesc" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand outline-none text-sm resize-none" placeholder="Provide more details..."></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Date</label>
                                    <input type="date" id="noticeDate" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand outline-none text-sm">
                                </div>
                                <button type="submit" id="noticeBtn" class="w-full bg-dark text-white font-semibold py-2.5 rounded-lg hover:bg-black transition-all text-sm">
                                    Publish Notice
                                </button>
                            </form>
                        </div>

                        <!-- Notice List -->
                        <div class="md:col-span-2">
                            <div class="flex justify-between items-end mb-4">
                                <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wider">Active Notices</h3>
                                <button onclick="fetchNotices()" class="text-brand text-sm font-medium hover:underline"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button>
                            </div>
                            <div id="noticeList" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                                <!-- Notice Items load here -->
                                <div class="text-center p-8 text-slate-400">Loading notices...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Next Module Placeholder (Fees, Staff, etc. can be added below similarly) -->
                <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-center">
                    <p class="text-indigo-800 text-sm font-medium"><i class="fa-solid fa-lock mr-2"></i> Other modules (Fees, Gallery, Staff) will appear here.</p>
                </div>

            </div>
        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = "https://xlmsgtxyrlovjobwvdom.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_iLRrB73mPbgH0FtPvMOVbg_eoNyCtd3"; 

        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        };

        // --- CHECK LOGIN STATUS ON LOAD ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedSchoolId = localStorage.getItem('school_id');
            const savedSchoolName = localStorage.getItem('school_name');
            
            // Set today's date in form
            document.getElementById('noticeDate').valueAsDate = new Date();

            if(savedSchoolId && savedSchoolName) {
                showDashboard(savedSchoolName);
            }
        });

        // --- LOGIN LOGIC ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            btn.innerHTML = `<div class="loader"></div>`;
            err.classList.add('hidden');

            try {
                // Fetch school where username & password match
                const res = await fetch(`${SUPABASE_URL}/rest/v1/schools?username=eq.${user}&password=eq.${pass}&select=id,school_name,is_active`, {
                    headers: headers
                });
                const data = await res.json();

                if(data.length === 0) {
                    throw new Error("Invalid Username or Password!");
                }
                if(data[0].is_active === false) {
                    throw new Error("Account is disabled. Contact Super Admin.");
                }

                // SUCCESS: Save core details in Local Storage (Multi-Tenancy Key)
                localStorage.setItem('school_id', data[0].id);
                localStorage.setItem('school_name', data[0].school_name);
                
                showDashboard(data[0].school_name);

            } catch (error) {
                err.innerText = error.message;
                err.classList.remove('hidden');
                btn.innerHTML = `<span>Secure Login</span>`;
            }
        });

        // --- SHOW DASHBOARD UI ---
        function showDashboard(schoolName) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            
            document.getElementById('headerSchoolName').innerText = schoolName;
            document.getElementById('headerSchoolInitials').innerText = schoolName.charAt(0).toUpperCase();
            
            // Load School's Private Data
            fetchNotices();
        }

        // --- LOGOUT LOGIC ---
        function logout() {
            localStorage.clear();
            window.location.reload();
        }

        // --- FETCH NOTICES (MULTI-TENANT READ) ---
        async function fetchNotices() {
            const schoolId = localStorage.getItem('school_id');
            const list = document.getElementById('noticeList');
            list.innerHTML = `<div class="text-center p-4"><div class="loader mx-auto border-brand"></div></div>`;

            try {
                // Notice the filter: ?school_id=eq.${schoolId} - THIS IS DATA ISOLATION
                const res = await fetch(`${SUPABASE_URL}/rest/v1/notices?school_id=eq.${schoolId}&order=created_at.desc`, { headers: headers });
                const data = await res.json();

                if(data.length === 0) {
                    list.innerHTML = `<div class="bg-white p-6 rounded-lg text-center border border-slate-200 text-slate-500 text-sm"><i class="fa-solid fa-folder-open text-2xl mb-2 text-slate-300 block"></i>No notices published yet.</div>`;
                    return;
                }

                list.innerHTML = '';
                data.forEach(notice => {
                    const dateObj = new Date(notice.notice_date);
                    const formattedDate = dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                    
                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 hover:border-brand/30 hover:shadow-md transition-all flex gap-4 items-start group">
                            <div class="bg-indigo-50 text-brand px-3 py-2 rounded-lg text-center min-w-[60px]">
                                <span class="block text-xl font-bold leading-none">${dateObj.getDate()}</span>
                                <span class="block text-xs font-semibold uppercase mt-1">${dateObj.toLocaleString('en-IN', { month: 'short' })}</span>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-slate-800 text-sm md:text-base">${notice.title}</h4>
                                ${notice.description ? `<p class="text-slate-600 text-xs md:text-sm mt-1 line-clamp-2">${notice.description}</p>` : ''}
                            </div>
                            <button onclick="deleteNotice('${notice.id}')" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-2">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                });
            } catch (error) {
                list.innerHTML = `<div class="text-red-500 text-sm text-center">Failed to load notices.</div>`;
            }
        }

        // --- ADD NOTICE (MULTI-TENANT WRITE) ---
        document.getElementById('noticeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('noticeBtn');
            btn.innerText = "Publishing...";
            btn.disabled = true;

            const schoolId = localStorage.getItem('school_id'); // GET FROM MEMORY
            const title = document.getElementById('noticeTitle').value;
            const desc = document.getElementById('noticeDesc').value;
            const date = document.getElementById('noticeDate').value;

            try {
                // Post data, automatically linking to the logged-in school
                const res = await fetch(`${SUPABASE_URL}/rest/v1/notices`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        school_id: schoolId,
                        title: title,
                        description: desc,
                        notice_date: date
                    })
                });

                if(!res.ok) throw new Error("Failed to add notice");

                document.getElementById('noticeForm').reset();
                document.getElementById('noticeDate').valueAsDate = new Date();
                fetchNotices(); // Refresh the list
                
            } catch (error) {
                alert(error.message);
            } finally {
                btn.innerText = "Publish Notice";
                btn.disabled = false;
            }
        });

        // --- DELETE NOTICE ---
        async function deleteNotice(noticeId) {
            if(!confirm("Are you sure you want to delete this notice?")) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/notices?id=eq.${noticeId}`, {
                    method: 'DELETE',
                    headers: headers
                });
                fetchNotices();
            } catch (e) {
                alert("Failed to delete.");
            }
        }
    </script>
</body>
</html>
