<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Admin Portal - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-btn.active { border-bottom: 2px solid #4f46e5; color: #4f46e5; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

    <!-- 1. LOGIN -->
    <div id="loginScreen" class="h-full flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden fade-in">
            <div class="bg-slate-800 p-8 text-center">
                <i class="fa-solid fa-graduation-cap text-4xl text-white mb-2"></i>
                <h2 class="text-2xl font-bold text-white">School Portal</h2>
                <p class="text-slate-300 text-sm mt-1">Pro Administration Dashboard</p>
            </div>
            <div class="p-8">
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                        <input type="text" id="loginUser" required class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                        <input type="password" id="loginPass" required class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg flex justify-center items-center">Secure Login</button>
                    <div id="loginError" class="hidden text-red-500 text-sm text-center font-medium mt-2"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="dashboardScreen" class="hidden h-full flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b shadow-sm z-20">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-xl" id="headerInitials">S</div>
                    <div>
                        <h1 id="headerName" class="font-bold text-slate-800 text-lg leading-tight">School</h1>
                        <p class="text-xs text-slate-500 font-medium">Admin Dashboard</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-red-500 p-2"><i class="fa-solid fa-power-off text-xl"></i></button>
            </div>
            <!-- Tabs -->
            <div class="max-w-7xl mx-auto px-4 flex overflow-x-auto border-t">
                <button onclick="switchTab('notices')" class="tab-btn active px-4 py-3 text-sm whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-2"></i>Notices</button>
                <button onclick="switchTab('events')" class="tab-btn px-4 py-3 text-sm whitespace-nowrap"><i class="fa-solid fa-calendar-days mr-2"></i>Events</button>
                <button onclick="switchTab('staff')" class="tab-btn px-4 py-3 text-sm whitespace-nowrap"><i class="fa-solid fa-chalkboard-user mr-2"></i>Staff</button>
                <button onclick="switchTab('gallery')" class="tab-btn px-4 py-3 text-sm whitespace-nowrap"><i class="fa-solid fa-images mr-2"></i>Gallery</button>
                <button onclick="switchTab('inquiries')" class="tab-btn px-4 py-3 text-sm whitespace-nowrap"><i class="fa-solid fa-envelope mr-2"></i>Inquiries</button>
                <button onclick="switchTab('settings')" class="tab-btn px-4 py-3 text-sm whitespace-nowrap"><i class="fa-solid fa-gear mr-2"></i>Branding</button>
            </div>
        </header>

        <!-- Main Area -->
        <main class="flex-1 overflow-y-auto bg-slate-50 p-4">
            <div class="max-w-5xl mx-auto space-y-6">
                
                <!-- NOTICES -->
                <div id="tab-notices" class="tab-content active fade-in space-y-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border">
                        <h3 class="font-bold text-sm mb-4"><i class="fa-solid fa-plus text-indigo-500 mr-2"></i>Post Notice</h3>
                        <form id="noticeForm" class="flex gap-4">
                            <input type="text" id="noticeTitle" required class="flex-1 px-3 py-2 border rounded-lg text-sm" placeholder="Title">
                            <input type="date" id="noticeDate" required class="px-3 py-2 border rounded-lg text-sm">
                            <button class="bg-slate-800 text-white py-2 px-6 rounded-lg text-sm">Post</button>
                        </form>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div class="bg-slate-100 px-4 py-3 font-bold text-sm border-b">Active Notices</div>
                        <div id="list-notices" class="p-2 space-y-2"></div>
                    </div>
                </div>

                <!-- EVENTS -->
                <div id="tab-events" class="tab-content fade-in space-y-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border">
                        <h3 class="font-bold text-sm mb-4"><i class="fa-solid fa-plus text-indigo-500 mr-2"></i>Add Event</h3>
                        <form id="eventForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input type="text" id="evTitle" required class="px-3 py-2 border rounded-lg text-sm" placeholder="Event Name">
                            <input type="date" id="evDate" required class="px-3 py-2 border rounded-lg text-sm">
                            <input type="text" id="evLoc" class="px-3 py-2 border rounded-lg text-sm" placeholder="Location">
                            <button class="bg-indigo-600 text-white py-2 px-6 rounded-lg text-sm md:col-span-3">Add Event</button>
                        </form>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div class="bg-slate-100 px-4 py-3 font-bold text-sm border-b">Upcoming Events</div>
                        <div id="list-events" class="p-2 space-y-2"></div>
                    </div>
                </div>

                <!-- STAFF -->
                <div id="tab-staff" class="tab-content fade-in space-y-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border">
                        <h3 class="font-bold text-sm mb-4"><i class="fa-solid fa-plus text-indigo-500 mr-2"></i>Add Staff Member</h3>
                        <form id="staffForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input type="text" id="stName" required class="px-3 py-2 border rounded-lg text-sm" placeholder="Name">
                            <input type="text" id="stRole" required class="px-3 py-2 border rounded-lg text-sm" placeholder="Role/Subject">
                            <input type="text" id="stPhoto" class="px-3 py-2 border rounded-lg text-sm" placeholder="Photo URL">
                            <button class="bg-indigo-600 text-white py-2 px-6 rounded-lg text-sm md:col-span-3">Add Staff</button>
                        </form>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div class="bg-slate-100 px-4 py-3 font-bold text-sm border-b">Staff Directory</div>
                        <div id="list-staff" class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                </div>

                <!-- GALLERY -->
                <div id="tab-gallery" class="tab-content fade-in space-y-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border">
                        <h3 class="font-bold text-sm mb-4"><i class="fa-solid fa-plus text-indigo-500 mr-2"></i>Upload Photo</h3>
                        <form id="galleryForm" class="flex gap-4">
                            <input type="text" id="galUrl" required class="flex-1 px-3 py-2 border rounded-lg text-sm" placeholder="Image URL">
                            <input type="text" id="galCap" class="flex-1 px-3 py-2 border rounded-lg text-sm" placeholder="Caption">
                            <button class="bg-indigo-600 text-white py-2 px-6 rounded-lg text-sm">Upload</button>
                        </form>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div class="bg-slate-100 px-4 py-3 font-bold text-sm border-b">Live Gallery</div>
                        <div id="list-gallery" class="p-4 grid grid-cols-3 gap-4"></div>
                    </div>
                </div>

                <!-- INQUIRIES -->
                <div id="tab-inquiries" class="tab-content fade-in space-y-6">
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div class="bg-slate-100 px-4 py-3 font-bold text-sm border-b flex justify-between">
                            Inquiries Inbox <button onclick="loadList('inquiries')" class="text-indigo-600"><i class="fa-solid fa-rotate"></i></button>
                        </div>
                        <div id="list-inquiries" class="p-2 space-y-2 max-h-[500px] overflow-y-auto"></div>
                    </div>
                </div>

                <!-- SETTINGS (BRANDING) -->
                <div id="tab-settings" class="tab-content fade-in">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border">
                        <h3 class="font-bold text-sm mb-4">White-Label Branding Setup</h3>
                        <form id="settingsForm" class="space-y-4">
                            <div><label class="text-xs font-bold text-slate-500">Primary Color</label><input type="color" id="setCol" class="w-full h-10"></div>
                            <div><label class="text-xs font-bold text-slate-500">Logo URL</label><input type="text" id="setLog" class="w-full px-3 py-2 border rounded text-sm"></div>
                            <div><label class="text-xs font-bold text-slate-500">About Us Text</label><textarea id="setAbt" rows="4" class="w-full px-3 py-2 border rounded text-sm"></textarea></div>
                            <button id="setBtn" class="w-full bg-green-600 text-white py-2 rounded font-bold">Save Branding</button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- JS LOGIC -->
    <script>
        const SUPABASE_URL = "https://xlmsgtxyrlovjobwvdom.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_iLRrB73mPbgH0FtPvMOVbg_eoNyCtd3"; 
        const headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('noticeDate').valueAsDate = new Date();
            document.getElementById('evDate').valueAsDate = new Date();
            if(localStorage.getItem('sid')) showDashboard(localStorage.getItem('sname'));
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn'); btn.innerHTML = '<div class="loader"></div>';
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/schools?username=eq.${document.getElementById('loginUser').value}&password=eq.${document.getElementById('loginPass').value}&select=*`, { headers });
                const data = await res.json();
                if(!data.length) throw new Error("Invalid Credentials");
                localStorage.setItem('sid', data[0].id); localStorage.setItem('sname', data[0].school_name);
                showDashboard(data[0].school_name);
                btn.innerHTML = 'Secure Login';
            } catch (err) {
                document.getElementById('loginError').innerText = err.message;
                document.getElementById('loginError').classList.remove('hidden');
                btn.innerHTML = 'Secure Login';
            }
        });

        function showDashboard(name) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('headerName').innerText = name;
            document.getElementById('headerInitials').innerText = name.charAt(0);
            
            // Load all data
            loadList('notices'); loadList('events'); loadList('staff_members'); loadList('galleries'); loadList('inquiries');
            loadSettings();
        }
        function logout() { localStorage.clear(); window.location.reload(); }
        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(`tab-${id}`).classList.add('active');
        }

        // Generic Load Data
        async function loadList(table) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?school_id=eq.${localStorage.getItem('sid')}&order=created_at.desc`, { headers });
            const data = await res.json();
            const el = document.getElementById(`list-${table==='staff_members'?'staff':(table==='galleries'?'gallery':table)}`);
            if(!data.length) return el.innerHTML = '<p class="text-center text-sm text-slate-400 py-4">No data found.</p>';

            if(table === 'notices') {
                el.innerHTML = data.map(i => `<div class="p-3 border-b flex justify-between"><div><p class="font-bold text-sm">${i.title}</p><p class="text-xs text-slate-500">${i.notice_date}</p></div><button onclick="del('${table}','${i.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>`).join('');
            } else if(table === 'events') {
                el.innerHTML = data.map(i => `<div class="p-3 border-b flex justify-between"><div><p class="font-bold text-sm">${i.title}</p><p class="text-xs text-slate-500">${i.event_date} | ${i.location||''}</p></div><button onclick="del('${table}','${i.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>`).join('');
            } else if(table === 'staff_members') {
                el.innerHTML = data.map(i => `<div class="flex items-center gap-3 border p-3 rounded"><img src="${i.photo_url||'https://via.placeholder.com/50'}" class="w-10 h-10 rounded-full object-cover"><div><p class="font-bold text-sm">${i.name}</p><p class="text-xs text-slate-500">${i.role}</p></div><button onclick="del('${table}','${i.id}')" class="ml-auto text-red-500"><i class="fa-solid fa-trash"></i></button></div>`).join('');
            } else if(table === 'galleries') {
                el.innerHTML = data.map(i => `<div class="relative group rounded border overflow-hidden"><img src="${i.image_url}" class="w-full h-24 object-cover"><div class="absolute bottom-0 w-full bg-black/60 text-white text-[10px] p-1 truncate">${i.caption||''}</div><button onclick="del('${table}','${i.id}')" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full opacity-0 group-hover:opacity-100"><i class="fa-solid fa-times text-xs"></i></button></div>`).join('');
            } else if(table === 'inquiries') {
                el.innerHTML = data.map(i => `<div class="p-3 border border-l-4 border-l-indigo-500 rounded"><div class="flex justify-between"><p class="font-bold text-sm">${i.name} <span class="font-normal text-xs text-slate-500">&lt;${i.email}&gt;</span></p><span class="text-xs text-slate-400">${new Date(i.created_at).toLocaleDateString()}</span></div><p class="text-sm mt-2 p-2 bg-slate-50 rounded">${i.message}</p></div>`).join('');
            }
        }

        // Generic Save
        async function saveData(formId, table, payloadFunc) {
            document.getElementById(formId).addEventListener('submit', async (e) => {
                e.preventDefault();
                await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method: 'POST', headers, body: JSON.stringify({ school_id: localStorage.getItem('sid'), ...payloadFunc() }) });
                document.getElementById(formId).reset();
                loadList(table);
            });
        }
        
        saveData('noticeForm', 'notices', () => ({ title: document.getElementById('noticeTitle').value, notice_date: document.getElementById('noticeDate').value }));
        saveData('eventForm', 'events', () => ({ title: document.getElementById('evTitle').value, event_date: document.getElementById('evDate').value, location: document.getElementById('evLoc').value }));
        saveData('staffForm', 'staff_members', () => ({ name: document.getElementById('stName').value, role: document.getElementById('stRole').value, photo_url: document.getElementById('stPhoto').value }));
        saveData('galleryForm', 'galleries', () => ({ image_url: document.getElementById('galUrl').value, caption: document.getElementById('galCap').value }));

        async function del(table, id) {
            if(!confirm('Delete?')) return;
            await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'DELETE', headers });
            loadList(table);
        }

        // Settings
        async function loadSettings() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/schools?id=eq.${localStorage.getItem('sid')}`, { headers });
            const d = await res.json();
            if(d.length) {
                if(d[0].primary_color) document.getElementById('setCol').value = d[0].primary_color;
                if(d[0].logo_url) document.getElementById('setLog').value = d[0].logo_url;
                if(d[0].about_us_text) document.getElementById('setAbt').value = d[0].about_us_text;
            }
        }
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('setBtn'); btn.innerText = "Saving...";
            await fetch(`${SUPABASE_URL}/rest/v1/schools?id=eq.${localStorage.getItem('sid')}`, {
                method: 'PATCH', headers, body: JSON.stringify({ primary_color: document.getElementById('setCol').value, logo_url: document.getElementById('setLog').value, about_us_text: document.getElementById('setAbt').value })
            });
            btn.innerText = "Saved Successfully!"; btn.classList.replace('bg-green-600', 'bg-slate-800');
            setTimeout(()=> { btn.innerText = "Save Branding"; btn.classList.replace('bg-slate-800', 'bg-green-600'); }, 2000);
        });
    </script>
</body>
</html>
